name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests packaging
      - name: Unit / integration / security tests
        run: pytest -q
      - name: Browser end-to-end tests (synthetic data)
        run: |
          python -m playwright install --with-deps chromium
          pytest -q -m e2e
      - name: Synthetic performance test (200k customers)
        run: pytest -q -m perf -s

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Tests on Windows
        run: pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean packaging/mirza2nexa.spec
      - name: Smoke test executable
        run: python packaging/smoke_test.py dist/Mirza2Nexa/Mirza2Nexa.exe
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Mirza2Nexa -DestinationPath Mirza2Nexa-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mirza2Nexa-windows-x64
          path: Mirza2Nexa-windows-x64.zip
          retention-days: 14
