name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nexa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Mhoseinshah1/nexa-bot
          ref: a50bc8a19cc37ceb545d95a35efa4652ddd6c24d
          path: nexa
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: nexa/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate an encrypted package from a synthetic backup
        shell: bash
        run: |
          python -m pip install -e .
          work="$(mktemp -d)"
          echo "SYNTHETIC_PACKAGE_DIR=$work" >> "$GITHUB_ENV"
          export SYNTHETIC_ZIP_PASSWORD=converter-ci-synthetic-password
          mirza2nexa synth "$work/source.zip" --users 40 --password-env SYNTHETIC_ZIP_PASSWORD
          status=0
          mirza2nexa convert "$work/source.zip" -o "$work" --key-out "$work/synthetic.nxkey" \
            --money-unit toman --password-env SYNTHETIC_ZIP_PASSWORD || status=$?
          # The synthetic dataset includes rejected rows for review. Code 2 still writes a
          # package, so Nexa must authenticate and validate it on the next step.
          test "$status" = 0 || test "$status" = 2
          package=("$work"/*.nxpkg)
          test "${#package[@]}" = 1
          test -f "${package[0]}"
          echo "SYNTHETIC_PACKAGE_FILE=${package[0]##*/}" >> "$GITHUB_ENV"
      - name: Verify with the pinned Nexa reader
        shell: bash
        run: |
          pnpm --dir nexa install --frozen-lockfile
          pnpm --dir nexa --filter @nexa/contracts build
          cp tests/interop/verify-nexa.ts nexa/apps/api/.mirza-contract-check.ts
          pnpm --dir nexa/apps/api exec tsx .mirza-contract-check.ts "$SYNTHETIC_PACKAGE_DIR" "$SYNTHETIC_PACKAGE_FILE"

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Lint
        run: ruff check src tests packaging
      - name: Unit / integration / security tests
        run: pytest -q
      - name: Browser end-to-end tests (synthetic data)
        run: |
          python -m playwright install --with-deps chromium
          pytest -q -m e2e
      - name: Synthetic performance test (200k customers)
        run: pytest -q -m perf -s
      - name: Build Linux executable (packaging regression check)
        run: pyinstaller --noconfirm --clean packaging/mirza2nexa.spec
      - name: Smoke test Linux executable
        run: python packaging/smoke_test.py dist/Mirza2Nexa/Mirza2Nexa
      - name: Executable end-to-end (synthetic; exe vs python, determinism)
        run: python packaging/exe_e2e.py dist/Mirza2Nexa/Mirza2Nexa --users 3000

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Tests on Windows
        run: pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean packaging/mirza2nexa.spec
      - name: Smoke test executable
        run: python packaging/smoke_test.py dist/Mirza2Nexa/Mirza2Nexa.exe
      - name: Executable end-to-end (synthetic; exe vs python, determinism)
        run: python packaging/exe_e2e.py dist/Mirza2Nexa/Mirza2Nexa.exe --users 3000
      - name: Read version
        shell: pwsh
        run: |
          $v = python -c "import mirza2nexa;print(mirza2nexa.__version__)"
          if (-not $v) { throw "could not read mirza2nexa version" }
          echo "M2N_VERSION=$v" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Mirza2Nexa -DestinationPath "Mirza2Nexa-windows-x64-v$env:M2N_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Mirza2Nexa-windows-x64-v${{ env.M2N_VERSION }}
          path: Mirza2Nexa-windows-x64-v${{ env.M2N_VERSION }}.zip
          retention-days: 14
