[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirza2nexa"
version = "0.6.0"
description = "Local-first, offline converter from Mirza SQL backups (ZIP) to versioned NEXA migration packages (.nxpkg)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pyzipper>=0.3.6",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.5", "playwright>=1.45"]
build = ["pyinstaller>=6.6"]

[project.scripts]
mirza2nexa = "mirza2nexa.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirza2nexa = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 600
markers = [
  "perf: synthetic performance test at production-comparable volume (slow)",
  "e2e: browser end-to-end tests (needs Playwright + Chromium)",
]
addopts = "-m 'not perf and not e2e'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
